[project]
name = "hr_portal"
authors = [
	{ name = "Intoship", email = "dev@intoship.cloud" }
]
description = "Single-company HR + attendance portal"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0-dev,<17.0.0"

[tool.bench.assets]
build_dir = "./frontend"
out_dir = "../hr_portal/public/frontend"
index_html_path = "../hr_portal/www/hr.html"

[project]
name = "hrms_custom"
authors = [{ name = "HRMS Team", email = "dev@example.com" }]
description = "Standalone HRMS on the Frappe Framework (employees, geofenced attendance, onboarding, documents, rosters)"
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<18.0.0"

[tool.ruff]
line-length = 110
target-version = "py314"

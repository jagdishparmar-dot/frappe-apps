[project]
name = "vendor_billing"
authors = [
    { name = "Coldverse", email = "vms@intoship.cloud" },
]
description = "Vendor billing Desk app (Frappe). The vendor OTP portal is the sibling Next.js app in /portal."
# Match Frappe Docker (frappe/build:v16 is typically 3.11–3.13)
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "boto3>=1.35.0",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B"]
ignore = ["E501"]

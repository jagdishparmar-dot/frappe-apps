[project]
name = "bench_control"
authors = [
	{ name = "Intoship", email = "dev@intoship.cloud" }
]
description = "Bench control plane — manage sites and apps on a shared Frappe bench"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0-dev,<17.0.0"

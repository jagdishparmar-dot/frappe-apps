# Local development overlay — published ports + optional gateway
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build -d
#
# Portal:  http://localhost:3000  (or http://localhost via gateway)
# Desk:    http://localhost:8080

services:
  frappe-nginx:
    ports:
      - "${FRAPPE_PORT:-8080}:8080"
    environment:
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_RECURSIVE: "off"

  vendor-web:
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      COOKIE_SECURE: ${COOKIE_SECURE:-false}

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./docker/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - vendor-web
      - frappe-nginx
    networks: [frappe_network]

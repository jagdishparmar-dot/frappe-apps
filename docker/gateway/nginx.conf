server {
  listen 80;
  server_name _;

  client_max_body_size 50m;

  # Next.js Vendor Portal
  location / {
    proxy_pass http://vendor-web:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Optional: Frappe Desk under /frappe/ (local only — Coolify uses separate domains)
  location /frappe/ {
    proxy_pass http://frappe-nginx:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Frappe-Site-Name vendors.localhost;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
}
